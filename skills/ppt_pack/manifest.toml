# Skill manifest — 描述技能包版本兼容性
[pack]
name = "hiveswarm-skill-ppt"
version = "0.1.0"
api_version = "1.0"
min_core_version = "0.1.0"
description = "PPT 制作 4 步流水线: 数据采集 / 大纲 / 排版 / 导出"

[skills]
# 修正: 4 个 skill 实际都在 ppt_pack/skills.py 单文件里,
# 原 file 字段指向不存在的 ppt_pack/skills/*.py 子模块(与本实现不符, 见 T1.6)
data_collect = { file = "ppt_pack/skills.py:DataCollectSkill", class = "DataCollectSkill" }
outline      = { file = "ppt_pack/skills.py:OutlineSkill", class = "OutlineSkill" }
layout       = { file = "ppt_pack/skills.py:LayoutSkill", class = "LayoutSkill" }
export       = { file = "ppt_pack/skills.py:ExportSkill", class = "ExportSkill" }